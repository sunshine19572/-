<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Топ причин, почему ты особенная</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#f7e8dc;--dim:#cdb9da;--rose:#f4a6bd;--gold:#f7d9a8;--night:#120a2b;color-scheme:dark;
 --serif:'Cormorant Garamond',Georgia,serif;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--night)}
body{font:400 1.0625rem/1.65 Manrope,system-ui,sans-serif;color:var(--ink);
 background:linear-gradient(180deg,#120a2b 0,#24114a 40%,#4a2158 75%,#6b2d62 100%)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.hero{position:relative;height:100svh;min-height:640px;overflow:hidden}
.glow{position:absolute;left:0;right:0;bottom:0;height:60svh;
 background:radial-gradient(ellipse 70% 80% at 50% 100%,rgba(244,140,170,.45),rgba(138,92,255,.14) 55%,transparent 76%)}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
.ridge{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:21svh;z-index:2;pointer-events:none}
.fade{height:18svh;margin-top:-1px;background:linear-gradient(#150b30,transparent)}
.head{position:absolute;top:7svh;left:0;right:0;text-align:center;padding:0 5vw;pointer-events:none;z-index:3}
h1{font:italic 500 clamp(2.2rem,7.4vw,5.8rem)/1 var(--serif);letter-spacing:-.01em;text-shadow:0 0 40px rgba(244,166,189,.35)}
h1 span{display:inline-block;opacity:0;transform:translateY(.4em);filter:blur(6px);
 animation:in 1.3s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*.16s + .3s)}
@keyframes in{to{opacity:1;transform:none;filter:none}}
.for{margin-top:1rem;color:var(--dim);opacity:0;animation:in 1s 1.6s forwards}
#card{position:absolute;z-index:4;left:50%;bottom:calc(4svh + env(safe-area-inset-bottom,0px));width:min(92vw,460px);
 transform:translate(-50%,16px);opacity:0;pointer-events:none;padding:1.1rem 1.4rem 1.2rem;
 border:1px solid rgba(247,217,168,.4);border-radius:18px;background:rgba(18,10,43,.78);
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:opacity .45s,transform .45s}
#card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#card small{color:var(--dim);font-size:.85rem}
#card h2{font:italic 600 1.9rem/1.1 var(--serif);color:var(--gold);margin:.2rem 0 .4rem}
.hint{position:absolute;z-index:3;left:0;right:0;bottom:calc(5svh + env(safe-area-inset-bottom,0px));text-align:center;
 color:var(--ink);font-size:.95rem;opacity:0;animation:in 1s 4.2s forwards;pointer-events:none}
.hint.off{animation:none;opacity:0}
main{max-width:1040px;margin:0 auto;padding:0 clamp(1.2rem,5vw,3rem)}
section{padding:clamp(3.5rem,9vw,6.5rem) 0}
.t{text-align:center;margin-bottom:3rem}
h3{font:italic 500 clamp(2.1rem,5.4vw,3.6rem)/1.05 var(--serif);color:var(--gold)}
.orn{display:flex;align-items:center;gap:1rem;justify-content:center;margin-top:1rem;color:var(--rose)}
.orn::before,.orn::after{content:'';width:min(90px,18vw);height:1px;background:linear-gradient(90deg,transparent,rgba(247,217,168,.6))}
.orn::after{transform:scaleX(-1)}
.top{list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:1.1rem}
@media(max-width:700px){.top{grid-template-columns:1fr}}
.top li{position:relative;overflow:hidden;padding:1.6rem 1.6rem 1.7rem;border-radius:20px;
 background:rgba(255,255,255,.05);border:1px solid rgba(247,217,168,.18);
 backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .3s,transform .3s}
.top li::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
 background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(244,166,189,.22),transparent 70%)}
.top li:hover{border-color:rgba(247,217,168,.5);transform:translateY(-3px)}
.top li:hover::before{opacity:1}
.top li::after{content:'✦';position:absolute;top:1rem;right:1.2rem;color:var(--gold);opacity:.55}
.top .n{display:block;font:italic 500 3.4rem/1 var(--serif);color:var(--rose);margin-bottom:.4rem;text-shadow:0 0 24px rgba(244,166,189,.5)}
.top h4{font:italic 600 1.7rem/1.15 var(--serif);margin-bottom:.35rem}
.top p{color:var(--dim)}
.shots{display:flex;gap:1.8rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:2rem 1rem 3rem;margin:0 -1rem}
.ph{flex:0 0 min(70vw,270px);aspect-ratio:3/4;scroll-snap-align:center;padding:11px 11px 48px;position:relative;
 background:#f7e8dc;border-radius:4px;transform:rotate(var(--r));box-shadow:0 20px 44px rgba(0,0,0,.45);transition:transform .35s}
.ph:hover{transform:rotate(0) scale(1.03)}
.ph::before{content:'';position:absolute;top:-11px;left:50%;width:78px;height:24px;transform:translateX(-50%) rotate(-3deg);background:rgba(247,217,168,.6)}
.ph i{position:relative;display:grid;place-items:center;height:100%;padding:1rem;text-align:center;color:#fff;
 font:italic 500 1.25rem/1.2 var(--serif);background:linear-gradient(160deg,var(--c1),var(--c2));overflow:hidden}
.ph i::before{content:'♥';position:absolute;font-size:9rem;opacity:.14;font-style:normal}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph figcaption{position:absolute;left:12px;right:12px;bottom:12px;color:#3a2147;font:italic 600 1.15rem var(--serif);text-align:center}
.gen{position:relative;text-align:center;overflow:hidden}
.gen::before{content:'';position:absolute;left:50%;top:48%;width:min(700px,120vw);aspect-ratio:1;transform:translate(-50%,-50%);
 background:radial-gradient(circle,rgba(244,166,189,.2),rgba(138,92,255,.08) 45%,transparent 68%);pointer-events:none}
.gen>*{position:relative}
.gen .lead{color:var(--dim);max-width:44ch;margin:0 auto 2rem}
.wish{font:500 1rem Manrope,sans-serif;padding:1rem 2.4rem;border-radius:999px;border:1px solid var(--gold);
 background:rgba(247,217,168,.08);color:var(--gold);cursor:pointer;box-shadow:0 0 30px rgba(247,217,168,.18);transition:background .25s,color .25s}
.wish:hover{background:var(--gold);color:var(--night)}
.wish:focus-visible{outline:2px solid var(--rose);outline-offset:4px}
.res{min-height:12rem;margin-top:2.5rem}
#wish{font:italic 500 clamp(1.8rem,4.6vw,2.7rem)/1.2 var(--serif);max-width:24ch;margin:0 auto;transition:opacity .35s}
#no{color:var(--dim);font-size:.9rem;margin-top:1rem}
.shoot{position:absolute;top:8%;left:-20%;width:150px;height:2px;opacity:0;background:linear-gradient(90deg,transparent,#fff);transform:rotate(18deg)}
@keyframes shoot{0%{opacity:1;transform:translate(0,0) rotate(18deg)}100%{opacity:0;transform:translate(1300px,420px) rotate(18deg)}}
footer{text-align:center;padding:3rem 1rem 6rem}
footer b{display:block;font:italic 500 clamp(2.4rem,6.5vw,4.4rem)/1.1 var(--serif);color:var(--rose);text-shadow:0 0 40px rgba(244,166,189,.5)}
footer span{color:var(--dim)}
.js .rv{opacity:0;transform:translateY(20px);transition:opacity .8s,transform .8s}
.js .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){h1 span,.for,.hint{animation:none;opacity:1;transform:none;filter:none}.js .rv{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<header class="hero">
  <div class="glow"></div>
  <canvas id="sky" role="img" aria-label="Созвездие в форме сердца из десяти ярких звёзд. Каждая звезда — одна причина."></canvas>
  <svg class="ridge" viewBox="0 0 1440 300" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2160"/><stop offset="1" stop-color="#1f1146"/></linearGradient></defs>
    <path fill="url(#rg)" d="M0 160C120 120 200 90 320 130S520 60 680 120S900 70 1060 125S1300 95 1440 140V300H0Z"/>
    <path fill="#150b30" d="M0 215C180 170 330 235 520 200S860 160 1040 205S1330 190 1440 175V300H0Z"/>
  </svg>
  <div class="head">
    <h1><span style="--i:0">Топ</span> <span style="--i:1">причин,</span> <span style="--i:2">почему</span> <span style="--i:3">ты</span> <span style="--i:4">особенная</span></h1>
    <p class="for">для дурынды</p>
  </div>
  <div class="hint" id="hint">Коснись любой яркой звезды</div>
  <div id="card" aria-live="polite"></div>
</header>
<div class="fade"></div>

<main>
  <section>
    <div class="t rv"><h3>Десять главных</h3><div class="orn">✦</div></div>
    <ol class="top" id="top"></ol>
  </section>

  <section>
    <div class="t rv"><h3>Мои любимые кадры</h3><div class="orn">✦</div></div>
    <!-- Чтобы вставить фото: замени <i>…</i> внутри .ph на <img src="photo.jpg" alt=""> -->
    <div class="shots rv">
      <figure class="ph" style="--r:-2deg;--c1:#8a5cff;--c2:#f4a6bd"><img src="img/скриптонит.jpg" alt="тот самый день" loading="lazy"><figcaption>Самый счастливый день</figcaption></figure>
      <figure class="ph" style="--r:1.5deg;--c1:#f4a6bd;--c2:#f7d9a8"><img src="img/блондинка.jpg" alt="ты смеёшься" loading="lazy"><figcaption>Моя блондиночка</figcaption></figure>
      <figure class="ph" style="--r:-1deg;--c1:#5a2a5c;--c2:#8a5cff"><img src="img/милашка.jpg" alt="просто ты" loading="lazy"><figcaption>Самая нежная</figcaption></figure>
      <figure class="ph" style="--r:2deg;--c1:#f7d9a8;--c2:#8a5cff"><img src="img/на улице.jpg" alt="наш вечер" loading="lazy"><figcaption>Самая милая</figcaption></figure>
      <figure class="ph" style="--r:-1.5deg;--c1:#f4a6bd;--c2:#5a2a5c"><img src="img/домашняя.jpg" alt="моя любимая" loading="lazy"><figcaption>Дом это ты</figcaption></figure>

    </div>
  </section>

  <section class="gen">
    <i class="shoot"></i>
    <div class="t rv"><h3>Ещё 991 причина</h3><div class="orn">✦</div></div>
    <p class="lead rv">Десять — это только верхушка. Всего причин 1001, и каждая настоящая.</p>
    <button class="wish" id="btn" type="button">Загадать причину</button>
    <div class="res" aria-live="polite"><p id="wish"></p><p id="no"></p></div>
  </section>
</main>

<footer><b>Это только начало.</b><span>Остальные причины — при личной встрече.</span></footer>

<script>
document.documentElement.classList.add('js');
const R=[
['Твоя улыбка','Она включает свет раньше, чем ты успеваешь что-то сказать.'],
['Ты настоящая','Рядом с тобой не нужно играть роль. Можно просто быть собой.'],
['Твой смех','Он такой заразительный, что смеются даже те, кто не слышал шутку.'],
['Ты замечаешь хорошее','В людях, в мелочах, в обычном дне — и делишься этим.'],
['Твои глаза','В них можно потеряться и совсем не захотеть искать дорогу назад.'],
['Рядом с тобой спокойно','Мир становится тише, а всё сложное — чуточку проще.'],
['Ты сильная и нежная','Редкое сочетание, и у тебя оно выходит без усилий.'],
['Твои мечты','Они смелые и настоящие, и я хочу быть рядом, когда они сбываются.'],
['Ты делаешь дни особенными','Даже самый обычный вторник с тобой запоминается.'],
['Просто ты','Не за что-то одно, а целиком. Другой такой нет.']];
const P=['За то, как ты морщишь нос, когда смеёшься.','За твои тёплые руки.','За то, что с тобой любое место становится домом.','За твоё «ну давай» перед любой авантюрой.','За то, как ты говоришь о том, что любишь.','За твою заботу, которую ты считаешь мелочью.','За то, что ты помнишь важные детали.','За твой голос по утрам.','За то, что ты не сдаёшься.','За твою доброту без показухи.','За то, что ты умеешь слушать.','За твои глупые шутки, которые на самом деле смешные.','За то, как ты радуешься мелочам.','За то, что с тобой не скучно ни минуты.','За твои объятия, после которых всё хорошо.','За то, что ты веришь в меня.','За то, как ты танцуешь, когда думаешь, что никто не видит.','За твою искренность.','За то, что ты делаешь меня лучше.','За то, что ты есть.'];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cl=(v,a,b)=>Math.min(b,Math.max(a,v));

const topList=document.getElementById('top');
topList.innerHTML=R.map((r,i)=>'<li class="rv"><span class="n">'+(i+1)+'</span><h4>'+r[0]+'</h4><p>'+r[1]+'</p></li>').join('');
topList.addEventListener('pointermove',e=>{const li=e.target.closest('li');if(!li)return;const b=li.getBoundingClientRect();li.style.setProperty('--mx',(e.clientX-b.left)+'px');li.style.setProperty('--my',(e.clientY-b.top)+'px')});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.rv').forEach((el,i)=>{el.style.transitionDelay=(el.tagName==='LI'?(i%2)*.1:0)+'s';io.observe(el)});

/* ---------- фон: туманности, Млечный Путь, звёзды, падающие звёзды ---------- */
const bc=document.getElementById('bg'),bx=bc.getContext('2d');
let BW,BH,off,tw=[],sh=null,nextSh=2.5;
function fitBg(){BW=innerWidth;BH=innerHeight;bc.width=BW;bc.height=BH;
 off=document.createElement('canvas');off.width=BW;off.height=BH*2;const o=off.getContext('2d'),M=Math.max(BW,BH);
 [[.2,.25,.6,'138,92,255',.24],[.85,.55,.55,'244,100,160',.2],[.3,.95,.65,'90,60,200',.22],[.8,1.3,.6,'244,166,189',.18],[.2,1.7,.55,'138,92,255',.2]].forEach(([x,y,r,c,a])=>{
  const g=o.createRadialGradient(x*BW,y*BH,0,x*BW,y*BH,r*M);g.addColorStop(0,'rgba('+c+','+a+')');g.addColorStop(1,'rgba('+c+',0)');o.fillStyle=g;o.fillRect(0,0,BW,BH*2)});
 o.save();o.translate(BW/2,BH);o.rotate(-.5);
 const mg=o.createLinearGradient(0,-BH*.3,0,BH*.3);mg.addColorStop(0,'rgba(255,230,240,0)');mg.addColorStop(.5,'rgba(255,230,240,.08)');mg.addColorStop(1,'rgba(255,230,240,0)');
 o.fillStyle=mg;o.fillRect(-BW*1.5,-BH*.3,BW*3,BH*.6);
 for(let i=0;i<1800;i++){const u=(Math.random()-.5)*M*2.4,v=(Math.random()+Math.random()+Math.random()-1.5)*BH*.26;o.fillStyle='rgba(255,240,250,'+(.15+Math.random()*.5)+')';o.fillRect(u,v,1,1)}
 o.restore();
 tw=Array.from({length:1001},()=>({x:Math.random()*BW,y:Math.random()*BH,r:.4+Math.random()*1.1,p:Math.random()*6.28,v:.6+Math.random()*1.8}))}
function drawBg(now){
 const el=now/1000,mx=Math.max(1,document.documentElement.scrollHeight-BH),ph=cl(scrollY/mx,0,1);
 bx.clearRect(0,0,BW,BH);bx.drawImage(off,0,-ph*BH);bx.fillStyle='#fff';
 for(const b of tw){const y=((b.y-ph*BH*1.4)%BH+BH)%BH;bx.globalAlpha=reduce?.55:.25+.75*(.5+.5*Math.sin(el*b.v+b.p));bx.fillRect(b.x,y,b.r,b.r)}
 bx.globalAlpha=1;
 if(!reduce){
  if(!sh&&el>nextSh){const a=.35+Math.random()*.25;sh={x:Math.random()*BW*.7,y:Math.random()*BH*.35,vx:Math.cos(a)*9,vy:Math.sin(a)*9,l:0};nextSh=el+5+Math.random()*6}
  if(sh){sh.x+=sh.vx;sh.y+=sh.vy;sh.l+=.02;const a=1-sh.l;if(a<=0)sh=null;else{const g=bx.createLinearGradient(sh.x,sh.y,sh.x-sh.vx*9,sh.y-sh.vy*9);g.addColorStop(0,'rgba(255,255,255,'+a+')');g.addColorStop(1,'rgba(255,255,255,0)');
   bx.strokeStyle=g;bx.lineWidth=1.6;bx.beginPath();bx.moveTo(sh.x,sh.y);bx.lineTo(sh.x-sh.vx*9,sh.y-sh.vy*9);bx.stroke()}}}
}

/* ---------- сердце-созвездие ---------- */
const cv=document.getElementById('sky'),cx=cv.getContext('2d'),card=document.getElementById('card'),hint=document.getElementById('hint');
const N=720,HP=[];
(function(){let L=0,px=0,py=0;for(let i=0;i<=N;i++){const t=Math.PI+i/N*Math.PI*2,x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)+3.7;
 if(i)L+=Math.hypot(x-px,y-py);HP.push({x,y,l:L});px=x;py=y}HP.forEach(p=>p.l/=L)})();
function at(f){f=cl(f,0,1);let lo=0,hi=N;while(hi-lo>1){const m=(lo+hi)>>1;HP[m].l<f?lo=m:hi=m}const a=HP[lo],b=HP[hi],u=(f-a.l)/((b.l-a.l)||1);return{x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u}}
let W,H,s,cxm,cym,line=[],pts=[],dust=[],inner=[],fly=[],hov=-1,sel=-1;const t0=performance.now();
function fit(){const D=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);
 s=Math.min(W*.8/32,H*.42/26.5);cxm=W/2;cym=H*.54;
 const P=f=>{const p=at(f);return{x:cxm+p.x*s,y:cym-p.y*s}};
 line=HP.map(p=>({x:cxm+p.x*s,y:cym-p.y*s}));
 pts=R.map((_,i)=>{const p=P(i/10);return{x:p.x,y:p.y,g:Math.min(i/10,1-i/10)*2}});
 dust=Array.from({length:170},()=>{const f=Math.random(),a=at(f-.003),b=at(f+.003),p=at(f),dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,o=(Math.random()-.5)*1.7;
  return{x:cxm+(p.x-dy/d*o)*s,y:cym-(p.y+dx/d*o)*s,g:Math.min(f,1-f)*2,r:.5+Math.random()*1.2,p:Math.random()*6.28,v:.8+Math.random()*2}});
 inner=Array.from({length:130},()=>{const f=Math.random(),p=at(f),k=Math.sqrt(Math.random())*.9;
  return{x:cxm+p.x*s*k,y:cym-p.y*s*k,r:.4+Math.random()*1,p:Math.random()*6.28,v:.6+Math.random()*1.6}});
 fly=Array.from({length:30},()=>({x:Math.random()*W,y:H*.3+Math.random()*H*.55,sp:.12+Math.random()*.3,ph:Math.random()*6.28,r:1.2+Math.random()*2}))}
function glow(x,y,r,c,a){const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba('+c+','+a+')');g.addColorStop(1,'rgba('+c+',0)');cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,6.283);cx.fill()}
function draw(now){
 const el=reduce?99:(now-t0)/1000,k=reduce?1.3:cl((el-.7)/3.6,0,1.3),kl=Math.min(1,k);
 cx.clearRect(0,0,W,H);
 const beat=reduce?0:Math.max(0,Math.sin(el*2.2))**6;
 glow(cxm,cym,s*19,'244,166,189',.1*kl+.07*beat);
 cx.fillStyle='#fff6ee';
 for(const p of inner){cx.globalAlpha=cl(k-.3,0,1)*(.12+.4*(.5+.5*Math.sin(el*p.v+p.p)));cx.fillRect(p.x,p.y,p.r,p.r)}
 for(const p of dust){const v=cl((k-p.g)*6,0,1);if(!v)continue;cx.globalAlpha=v*(.35+.65*(.5+.5*Math.sin(el*p.v+p.p)));cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}
 cx.globalAlpha=1;
 const n=Math.floor(kl*N/2);
